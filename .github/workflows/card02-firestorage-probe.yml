name: Card02 Firestorage Probe

on:
  push:
    branches:
      - transport/card02-github-actions
    paths:
      - .github/workflows/card02-firestorage-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve firestorage public file API prefix
        env:
          CHUNK_URL: https://firestorage.ai/_next/static/chunks/4899-d89df949f2dbd5af.js
          SHARE_ID: UbtC6RJp2_Ok
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,re,urllib.error,urllib.request

          headers={'User-Agent':'Mozilla/5.0 Chrome/151','Accept':'application/javascript,application/json,*/*'}
          req=urllib.request.Request(os.environ['CHUNK_URL'],headers=headers)
          with urllib.request.urlopen(req,timeout=30) as r:
              js=r.read().decode('utf-8','replace')
          print('JS_BYTES=',len(js.encode()))

          # Show every assignment/string containing api.firestorage.ai, with tight context.
          needle='api.firestorage.ai'
          pos=0; n=0
          while n<12:
              i=js.find(needle,pos)
              if i<0: break
              print(f'API_CTX_{n}=',js[max(0,i-650):min(len(js),i+1150)].replace('\n',' ')[:1800])
              pos=i+len(needle); n+=1
          print('API_OCCURRENCES=',n)

          # Show the exact public-share loader function around /shares/${...}/files.
          for needle2 in ['/files?maxResults=1000','/shares/${','downloadUrl','File API returned']:
              i=js.find(needle2)
              print('TERM=',needle2,'POS=',i)
              if i>=0:
                  print('CTX=',js[max(0,i-1500):min(len(js),i+1800)].replace('\n',' ')[:3300])

          # Extract full string literals that mention the API host.
          strings=sorted(set(re.findall(r'["\'](https://api\.firestorage\.ai[^"\']*)["\']',js)))
          print('API_STRINGS=',strings)

          share=os.environ['SHARE_ID']
          # Probe only prefixes actually observed, plus the one shared file-api prefix from the client core.
          bases=set()
          for s in strings:
              if '${' not in s and '`' not in s:
                  bases.add(s if s.endswith('/') else s+'/')
          bases.update([
              'https://api.firestorage.ai/prod/',
              'https://api.firestorage.ai/prod/file/',
              'https://api.firestorage.ai/prod/file/v1/',
              'https://api.firestorage.ai/prod/file/v1/public/',
          ])
          for base in sorted(bases):
              url=base+f'shares/{share}/files?maxResults=1000'
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Chrome/151','Accept':'application/json,*/*'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      body=r.read().decode('utf-8','replace')
                      print('PROBE=',url,'STATUS=',r.status,'TYPE=',r.headers.get('Content-Type'),'BODY=',body[:3000])
              except urllib.error.HTTPError as e:
                  body=e.read().decode('utf-8','replace')
                  print('PROBE=',url,'STATUS=',e.code,'TYPE=',e.headers.get('Content-Type'),'BODY=',body[:500])
              except Exception as e:
                  print('PROBE=',url,'ERROR=',repr(e))
          PY
