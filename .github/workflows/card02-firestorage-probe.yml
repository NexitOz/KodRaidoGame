name: Card02 Firestorage Probe

on:
  push:
    branches:
      - transport/card02-github-actions
    paths:
      - .github/workflows/card02-firestorage-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Identify firestorage public content token
        env:
          BASE: https://firestorage.ai
          SHARE_ID: UbtC6RJp2_Ok
          PUBLIC_ID: EVRn3M1IL7mzwH0F
          SUBDIR: CAf5Hi
          FILE_ID: 01a044b6f15c732c90c67a9d3375965e
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.error, urllib.request

          base=os.environ['BASE'].rstrip('/')
          share=os.environ['SHARE_ID']
          candidates=[
              os.environ['PUBLIC_ID'],
              os.environ['SUBDIR'],
              share,
              os.environ['FILE_ID'],
          ]
          headers={'User-Agent':'Mozilla/5.0 Chrome/151','Accept':'application/json,text/plain,*/*'}

          def probe(path):
              url=base+path
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      body=r.read().decode('utf-8','replace')
                      print('\nURL=',url)
                      print('STATUS=',getattr(r,'status',None))
                      print('TYPE=',r.headers.get('Content-Type'))
                      print('BODY=',body[:5000])
                      return getattr(r,'status',None), body
              except urllib.error.HTTPError as e:
                  body=e.read().decode('utf-8','replace')
                  print('\nURL=',url)
                  print('STATUS=',e.code)
                  print('TYPE=',e.headers.get('Content-Type'))
                  print('BODY=',body[:3000])
                  return e.code, body
              except Exception as e:
                  print('\nURL=',url,'ERROR=',repr(e))
                  return None,''

          for token in candidates:
              probe(f'/api/p/{share}/{token}')
              probe(f'/api/p/{share}/{token}/content?page=1')
          PY
