name: Card02 Firestorage Probe

on:
  push:
    branches:
      - transport/card02-github-actions
    paths:
      - .github/workflows/card02-firestorage-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect firestorage Next.js bundles for public download API
        env:
          SHARE_URL: https://firestorage.ai/ja/f/UbtC6RJp2_Ok
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re, urllib.parse, urllib.request

          share = os.environ['SHARE_URL']
          headers = {'User-Agent':'Mozilla/5.0 Chrome/151'}
          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode('utf-8', 'replace'), r.geturl()

          html, final = get(share)
          scripts = re.findall(r'<script[^>]+src="([^"]+)"', html)
          print('SCRIPT_COUNT=', len(scripts))
          terms = [
              'download', 'shareId', 'publicId', 'share_id', 'public_id',
              '/api/', 'api/', 'presign', 'signed', 'object', 'files', 'attachments'
          ]
          for src in scripts:
              url = urllib.parse.urljoin(final, src)
              try:
                  js, _ = get(url)
              except Exception as e:
                  print('SCRIPT_ERROR=', url, repr(e))
                  continue
              low = js.lower()
              if not any(t.lower() in low for t in terms):
                  continue
              print('\n=== SCRIPT', url, 'BYTES', len(js.encode('utf-8')), '===')
              shown = 0
              seen = set()
              for term in terms:
                  t = term.lower()
                  pos = 0
                  while shown < 40:
                      i = low.find(t, pos)
                      if i < 0:
                          break
                      snippet = js[max(0,i-500):min(len(js),i+1200)].replace('\n',' ')
                      key = snippet[:300]
                      if key not in seen:
                          print(f'--- {term} @ {i} ---')
                          print(snippet)
                          seen.add(key)
                          shown += 1
                      pos = i + len(term)
          PY
