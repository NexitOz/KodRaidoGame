name: Card02 Firestorage Probe

on:
  push:
    branches:
      - transport/card02-github-actions
    paths:
      - .github/workflows/card02-firestorage-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public firestorage share page
        env:
          SHARE_URL: https://firestorage.ai/ja/f/UbtC6RJp2_Ok
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re, urllib.request
          url = os.environ['SHARE_URL']
          req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 Chrome/151'})
          with urllib.request.urlopen(req, timeout=30) as r:
              html = r.read().decode('utf-8', 'replace')
              print('STATUS=', getattr(r, 'status', None))
              print('FINAL_URL=', r.geturl())
              print('HTML_BYTES=', len(html.encode('utf-8')))
          needles = ['seal-of-the-curse.webp', '01a044b6f15c732c90c67a9d3375965e', 'EVRn3M1IL7mzwH0F', 'download', '/api/', 'CAf5Hi']
          for needle in needles:
              print(f'--- CONTEXT {needle} ---')
              start = 0
              hits = 0
              low = html.lower()
              nlow = needle.lower()
              while True:
                  i = low.find(nlow, start)
                  if i < 0 or hits >= 10:
                      break
                  print(html[max(0,i-500):min(len(html),i+1000)].replace('\n',' '))
                  start = i + len(needle)
                  hits += 1
              print('HITS=', hits)
          urls = sorted(set(re.findall(r'https?://[^\"\'<>\\s]+', html)))
          print('--- CANDIDATE URLS ---')
          for u in urls:
              lu=u.lower()
              if any(x in lu for x in ['firestorage','download','file','object','storage','webp']):
                  print(u[:2000])
          PY
