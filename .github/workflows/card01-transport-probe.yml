name: Card01 Transport Probe

on:
  push:
    branches:
      - transport/art-pack-04-card01-github-actions
    paths:
      - .github/workflows/card01-transport-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the Firestorage share (read-only, no commit)
        env:
          SHARE_ID: aZIlHM-TkPI7
          CONTROL_SHARE_ID: 8hmlyOzbah75
          EXPECTED_SIZE: "596976"
        run: |
          set -euo pipefail
          python - <<'PY'
          import itertools, json, os, urllib.request, urllib.error

          api = 'https://api.firestorage.ai/prod/file'
          ua = {'User-Agent': 'Mozilla/5.0 Chrome/151', 'Accept': 'application/json,*/*'}
          expected_size = int(os.environ['EXPECTED_SIZE'])

          def get(url):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=ua), timeout=20) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()
              except Exception as e:
                  return -1, str(e).encode()

          # 1. Positive control: does the endpoint that worked for Card 04 still resolve?
          ctl = os.environ['CONTROL_SHARE_ID']
          code, body = get(f'{api}/shares/{ctl}/files?maxResults=1000')
          print(f'CONTROL_CARD04_SHARE={ctl} STATUS={code} BODY={body[:200]!r}')
          print('ENDPOINT_STILL_WORKS=', 'YES' if code == 200 else 'NO/EXPIRED')

          # 2. The share id as supplied.
          share = os.environ['SHARE_ID']
          code, body = get(f'{api}/shares/{share}/files?maxResults=1000')
          print(f'AS_SUPPLIED={share} STATUS={code} BODY={body[:200]!r}')

          # 3. Bounded check for I/l glyph confusion in the owner-supplied id. Only the ambiguous
          #    capital-I / lowercase-l positions are varied; nothing else is guessed, and any hit
          #    still has to clear the SHA-256 / blob / size gates before a single byte is committed.
          amb = [i for i, c in enumerate(share) if c in 'Il']
          print('AMBIGUOUS_POSITIONS=', amb, 'VARIANTS=', 2 ** len(amb))
          hits = []
          for combo in itertools.product('Il', repeat=len(amb)):
              cand = list(share)
              for pos, ch in zip(amb, combo):
                  cand[pos] = ch
              cand = ''.join(cand)
              if cand == share:
                  continue
              code, body = get(f'{api}/shares/{cand}/files?maxResults=1000')
              print(f'VARIANT={cand} STATUS={code}')
              if code == 200:
                  hits.append((cand, body))

          for cand, body in hits:
              meta = json.loads(body.decode('utf-8'))
              files = meta.get('files') or []
              print(f'HIT_SHARE={cand} FILE_COUNT={len(files)}')
              for f in files:
                  print('  ENTRY=', f.get('fileId'), f.get('fileName'), f.get('contentType'), f.get('sizeBytes'))
              sized = [f for f in files if int(f.get('sizeBytes', -1)) == expected_size]
              print(f'  MATCHES_EXPECTED_SIZE={len(sized)}')

          print('RESOLVABLE_SHARE_FOUND=', 'YES' if hits else 'NO')
          print('PROBE_COMPLETE')
          PY
