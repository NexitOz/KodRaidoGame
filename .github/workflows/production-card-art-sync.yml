name: One-time production card artwork sync

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type SYNC-12-CARD-ART-PRODUCTION to authorize the controlled production sync
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-card-art-sync
  cancel-in-progress: false

jobs:
  sync-production-card-art:
    name: Verify and synchronize twelve production card artwork records
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pinned to the merged Card 02 integration commit containing the reviewed 12-card seed/art source of truth.
      # Production dispatch still requires fresh explicit owner confirmation via the workflow input below.
      REQUIRED_SOURCE_COMMIT: 8d41b6570e0a7a29ec7ecc38b0c6075aed8a4757
      SOURCE_COMMIT: 8d41b6570e0a7a29ec7ecc38b0c6075aed8a4757
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    steps:
      - name: Require exact manual confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "SYNC-12-CARD-ART-PRODUCTION"

      - name: Check out the reviewed workflow revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable production source commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          actual_main="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$REQUIRED_SOURCE_COMMIT" "$actual_main"
          git merge-base --is-ancestor "$REQUIRED_SOURCE_COMMIT" HEAD
          git diff --quiet "$REQUIRED_SOURCE_COMMIT".."$actual_main" -- \
            apps/game-server/prisma/seed.ts \
            apps/game-server/prisma/schema.prisma \
            apps/web/public/art/cards
          git diff --quiet "$REQUIRED_SOURCE_COMMIT"..HEAD -- \
            apps/game-server/prisma/seed.ts \
            apps/game-server/prisma/schema.prisma \
            apps/web/public/art/cards
          echo "IMMUTABLE_SOURCE_SHA_VERIFIED=$REQUIRED_SOURCE_COMMIT"
          echo "CURRENT_MAIN_SHA=$actual_main"

      - name: Verify all twelve committed artwork files
        shell: bash
        run: |
          set -euo pipefail
          slugs=(
            necromancer-of-the-twilight-order
            high-warden-of-the-white-rune
            matriarch-of-the-spring-light
            lord-of-the-nameless-shadow
            keeper-of-the-grey-mist
            lord-of-the-stellar-stream
            whisper-of-the-forgotten
            ashen-blade
            keeper-of-smoldering-embers
            rune-of-the-echoing-dusk
            acolyte-of-the-white-rune
            seal-of-the-curse
          )
          for slug in "${slugs[@]}"; do
            git cat-file -e "$REQUIRED_SOURCE_COMMIT:apps/web/public/art/cards/$slug.webp"
          done
          echo "ARTWORK_FILES_PRESENT=12/12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w apps/game-server

      - name: Require Railway project token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RAILWAY_TOKEN:-}"
          echo "RAILWAY_TOKEN_PRESENT=YES"

      - name: Verify production scope and read-only connectivity
        shell: bash
        run: |
          set -euo pipefail
          npm exec -- tsx apps/game-server/src/ops/railway-production-scope.ts -- \
            node -e \
              'const { PrismaClient } = require("@prisma/client"); const prisma = new PrismaClient(); prisma.$queryRaw`SELECT 1`.then(() => console.log("READ_ONLY_DB_PREFLIGHT=YES")).finally(() => prisma.$disconnect())' \
            | tee /tmp/production-scope.log
          grep -qx 'TOKEN_PROJECT_ID_VERIFIED=YES' /tmp/production-scope.log
          grep -qx 'TOKEN_ENVIRONMENT_ID_VERIFIED=YES' /tmp/production-scope.log
          grep -qx 'GAME_SERVER_DB_LINK_VERIFIED=YES' /tmp/production-scope.log
          grep -qx 'PRODUCTION_SCOPE_VERIFIED=YES' /tmp/production-scope.log
          grep -qx 'READ_ONLY_DB_PREFLIGHT=YES' /tmp/production-scope.log

      - name: PRE-WRITE read-only verification
        id: prewrite
        shell: bash
        run: |
          set -euo pipefail
          npm exec -- tsx apps/game-server/src/ops/railway-production-scope.ts -- \
            npm exec -- tsx apps/game-server/scripts/sync-production-card-art.ts --check \
            | tee /tmp/prewrite.log
          grep -qx 'PRODUCTION_SCOPE_VERIFIED=YES' /tmp/prewrite.log
          grep -qx 'TARGET_ROWS=12' /tmp/prewrite.log
          grep -qx 'UNIQUE_SLUGS=12' /tmp/prewrite.log
          snapshot="$(sed -n 's/^PRE_WRITE_SNAPSHOT=//p' /tmp/prewrite.log)"
          test "$(printf '%s' "$snapshot" | wc -c)" -eq 64
          rows_requiring_mutation="$(sed -n 's/^ROWS_REQUIRING_MUTATION=//p' /tmp/prewrite.log)"
          test "$rows_requiring_mutation" -ge 0
          test "$rows_requiring_mutation" -le 12
          echo "snapshot=$snapshot" >> "$GITHUB_OUTPUT"
          echo "rows_requiring_mutation=$rows_requiring_mutation" >> "$GITHUB_OUTPUT"

      - name: Atomic APPLY
        if: steps.prewrite.outputs.rows_requiring_mutation != '0'
        shell: bash
        run: |
          set -euo pipefail
          npm exec -- tsx apps/game-server/src/ops/railway-production-scope.ts -- \
            npm exec -- tsx apps/game-server/scripts/sync-production-card-art.ts \
              --apply --expected-snapshot "${{ steps.prewrite.outputs.snapshot }}" \
            | tee /tmp/apply.log
          grep -qx 'PRODUCTION_SCOPE_VERIFIED=YES' /tmp/apply.log
          grep -qx 'TRANSACTION_STARTED=YES' /tmp/apply.log
          grep -qx 'TRANSACTION_COMMITTED=YES' /tmp/apply.log
          grep -qx 'TARGET_ROWS_FINAL=12' /tmp/apply.log
          grep -qx 'SOURCE_OF_TRUTH_MATCH=12/12' /tmp/apply.log
          grep -qx 'NON_TARGET_FIELD_CHANGES=0' /tmp/apply.log

      - name: Report already synchronized state
        if: steps.prewrite.outputs.rows_requiring_mutation == '0'
        run: |
          echo "ROWS_CHANGED=0"
          echo "DATABASE_ALREADY_SYNCHRONIZED=YES"

      - name: Independent POST-WRITE verification
        shell: bash
        run: |
          set -euo pipefail
          npm exec -- tsx apps/game-server/src/ops/railway-production-scope.ts -- \
            npm exec -- tsx apps/game-server/scripts/sync-production-card-art.ts --check \
            | tee /tmp/postwrite.log
          grep -qx 'PRODUCTION_SCOPE_VERIFIED=YES' /tmp/postwrite.log
          grep -qx 'TARGET_ROWS=12' /tmp/postwrite.log
          grep -qx 'UNIQUE_SLUGS=12' /tmp/postwrite.log
          grep -qx 'ROWS_REQUIRING_MUTATION=0' /tmp/postwrite.log
          grep -qx 'SOURCE_OF_TRUTH_MATCH=12/12' /tmp/postwrite.log
