name: Card01 BOND Binary Transport

on:
  push:
    branches:
      - transport/art-pack-04-card01-github-actions
    paths:
      - .github/workflows/card01-bond-binary-transport.yml

permissions:
  contents: write

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the approved Card 01 master and verify source bytes
        env:
          API_BASE: https://api.firestorage.ai/prod/file
          SHARE_ID: aZIlHM-TkPI7
          EXPECTED_SIZE: "596976"
          EXPECTED_SHA256: bc2e5abcfcedacfad6b98816229c0bb1205cb71d7177f09e88568442ecaaf9c2
          EXPECTED_BLOB_SHA: a52fb443ff296c4411c7dc0e640be98befbc12bc
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.request

          api = os.environ['API_BASE'].rstrip('/')
          share = os.environ['SHARE_ID']
          expected_size = int(os.environ['EXPECTED_SIZE'])
          expected_sha = os.environ['EXPECTED_SHA256'].lower()
          expected_blob = os.environ['EXPECTED_BLOB_SHA'].lower()
          headers = {'User-Agent': 'Mozilla/5.0 Chrome/151', 'Accept': 'application/json,*/*'}

          meta_url = f'{api}/shares/{share}/files?maxResults=1000'
          with urllib.request.urlopen(urllib.request.Request(meta_url, headers=headers), timeout=30) as r:
              meta = json.loads(r.read().decode('utf-8'))
          files = meta.get('files') or []
          print('PROVIDER_FILE_COUNT=', len(files))
          for f in files:
              print('PROVIDER_ENTRY=', f.get('fileId'), f.get('fileName'), f.get('contentType'), f.get('sizeBytes'))

          # Select on size + MIME. The provider's filename is recorded but never trusted - providers
          # append suffixes. The SHA-256 and Git blob SHA gates below are what prove identity.
          matches = [
              f for f in files
              if int(f.get('sizeBytes', -1)) == expected_size and f.get('contentType') == 'image/webp'
          ]
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one image/webp of {expected_size} bytes, found {len(matches)}')
          entry = matches[0]
          file_id = entry.get('fileId')
          print('SELECTED_FILE_ID=', file_id)
          print('SELECTED_FILE_NAME=', entry.get('fileName'))
          print('PROVIDER_METADATA_GATE=PASS')

          dl_api = f'{api}/shares/{share}/files/{file_id}/download'
          dl_req = urllib.request.Request(dl_api, data=b'', method='POST', headers=headers)
          with urllib.request.urlopen(dl_req, timeout=30) as r:
              payload = json.loads(r.read().decode('utf-8'))
          direct = payload.get('downloadUrl')
          if not direct:
              raise SystemExit(f'No downloadUrl from file API: {payload}')
          print('DOWNLOAD_URL_ISSUED=YES')

          file_req = urllib.request.Request(direct, headers={'User-Agent': 'Mozilla/5.0 Chrome/151'})
          with urllib.request.urlopen(file_req, timeout=120) as r:
              data = r.read()
              print('DOWNLOAD_HTTP_STATUS=', getattr(r, 'status', None))
              print('DOWNLOAD_CONTENT_TYPE=', r.headers.get('Content-Type'))
              print('DOWNLOAD_CONTENT_LENGTH=', r.headers.get('Content-Length'))

          size = len(data)
          sha = hashlib.sha256(data).hexdigest()
          blob_sha = hashlib.sha1(f'blob {size}\0'.encode('ascii') + data).hexdigest()
          riff_total = int.from_bytes(data[4:8], 'little') + 8 if len(data) >= 30 and data[:4] == b'RIFF' else -1
          fourcc = data[12:16] if len(data) >= 16 else b''
          width = height = -1
          if fourcc == b'VP8 ' and len(data) >= 30 and data[23:26] == b'\x9d\x01\x2a':
              width = int.from_bytes(data[26:28], 'little') & 0x3fff
              height = int.from_bytes(data[28:30], 'little') & 0x3fff

          print('MASTER_SIZE=', size)
          print('MASTER_SHA256=', sha)
          print('MASTER_GIT_BLOB_SHA=', blob_sha)
          print('MASTER_RIFF_TOTAL=', riff_total)
          print('MASTER_FOURCC=', repr(fourcc))
          print('MASTER_DIMENSIONS=', f'{width}x{height}')

          if size != expected_size:
              raise SystemExit(f'SIZE MISMATCH: {size} != {expected_size}')
          if sha != expected_sha:
              raise SystemExit(f'SHA256 MISMATCH: {sha} != {expected_sha}')
          if blob_sha != expected_blob:
              raise SystemExit(f'GIT BLOB SHA MISMATCH: {blob_sha} != {expected_blob}')
          if riff_total != expected_size:
              raise SystemExit(f'RIFF TOTAL MISMATCH: {riff_total} != {expected_size}')
          if fourcc != b'VP8 ':
              raise SystemExit(f'FOURCC MISMATCH: {fourcc!r}')
          if (width, height) != (1024, 1536):
              raise SystemExit(f'DIMENSIONS MISMATCH: {(width, height)}')

          with open('/tmp/child-of-the-spring-light.webp', 'wb') as f:
              f.write(data)
          print('SOURCE_BYTE_INTEGRITY=PASS')
          PY

          python -m pip install --quiet --disable-pip-version-check Pillow
          python - <<'PY'
          from PIL import Image
          p = '/tmp/child-of-the-spring-light.webp'
          with Image.open(p) as im:
              if im.format != 'WEBP':
                  raise SystemExit(f'FORMAT MISMATCH: {im.format}')
              if im.size != (1024, 1536):
                  raise SystemExit(f'DECODE DIMENSIONS MISMATCH: {im.size}')
              im.load()
              raw = im.convert('RGB').tobytes()
              if len(raw) != 1024 * 1536 * 3:
                  raise SystemExit(f'DECODED BYTE COUNT MISMATCH: {len(raw)}')
              print('DECODE_FORMAT=', im.format)
              print('DECODE_DIMENSIONS=', f'{im.width}x{im.height}')
              print('DECODED_RGB_BYTES=', len(raw))
          print('SOURCE_FULL_DECODE=PASS')
          PY

      - name: Commit onto the candidate branch and verify the Git object
        env:
          EXPECTED_SIZE: "596976"
          EXPECTED_SHA256: bc2e5abcfcedacfad6b98816229c0bb1205cb71d7177f09e88568442ecaaf9c2
          EXPECTED_BLOB_SHA: a52fb443ff296c4411c7dc0e640be98befbc12bc
          TARGET_BRANCH: assets/child-of-the-spring-light-candidate-v1
          TARGET_PATH: art-source/child-of-the-spring-light.webp
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"

          # Build on top of the existing candidate branch rather than recreating it, and never
          # overwrite an object that is already there.
          if git ls-tree -r "origin/$TARGET_BRANCH" --name-only | grep -qx "$TARGET_PATH"; then
            echo "Approved object already present on the candidate branch; refusing to overwrite."
            exit 1
          fi

          git switch --detach "origin/$TARGET_BRANCH"
          mkdir -p art-source
          cp /tmp/child-of-the-spring-light.webp "$TARGET_PATH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET_PATH"
          git commit -m "art: add exact approved Child of the Spring Light candidate"

          LOCAL_SIZE="$(git cat-file -s "HEAD:$TARGET_PATH")"
          LOCAL_SHA="$(git show "HEAD:$TARGET_PATH" | sha256sum | awk '{print $1}')"
          LOCAL_BLOB="$(git rev-parse "HEAD:$TARGET_PATH")"
          echo "LOCAL_GIT_SIZE=$LOCAL_SIZE"
          echo "LOCAL_GIT_SHA256=$LOCAL_SHA"
          echo "LOCAL_GIT_BLOB_SHA=$LOCAL_BLOB"
          test "$LOCAL_SIZE" = "$EXPECTED_SIZE"
          test "$LOCAL_SHA" = "$EXPECTED_SHA256"
          test "$LOCAL_BLOB" = "$EXPECTED_BLOB_SHA"

          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git fetch origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH" --force

          REMOTE_SIZE="$(git cat-file -s "origin/$TARGET_BRANCH:$TARGET_PATH")"
          REMOTE_SHA="$(git show "origin/$TARGET_BRANCH:$TARGET_PATH" | sha256sum | awk '{print $1}')"
          REMOTE_BLOB="$(git rev-parse "origin/$TARGET_BRANCH:$TARGET_PATH")"
          echo "REMOTE_GIT_SIZE=$REMOTE_SIZE"
          echo "REMOTE_GIT_SHA256=$REMOTE_SHA"
          echo "REMOTE_GIT_BLOB_SHA=$REMOTE_BLOB"
          echo "REMOTE_HEAD_SHA=$(git rev-parse "origin/$TARGET_BRANCH")"
          test "$REMOTE_SIZE" = "$EXPECTED_SIZE"
          test "$REMOTE_SHA" = "$EXPECTED_SHA256"
          test "$REMOTE_BLOB" = "$EXPECTED_BLOB_SHA"
          echo "CANDIDATE_REMOTE_INTEGRITY=PASS"
